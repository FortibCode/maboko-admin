name: CI Back-office

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  qualite:
    name: Typage, style et compilation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier le typage
        run: npm run typecheck

      - name: Vérifier le style
        run: npm run lint

      - name: Compiler
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.maboko.cg/api/v1

      # Un back-office manipule des données personnelles : une dépendance
      # vulnérable n'y a pas sa place.
      - name: Audit des dépendances
        run: npm audit --audit-level=high
